<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first viewport: no scaling, fits device width, prevents zoom -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Relic Hunter</title>
  <meta name="description"
    content="Relic Hunter — a mobile dungeon crawler prototype with fog of war and digging mini-games." />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      /* Use dynamic viewport height so the game fills whatever the actual
           visible area is (respects iOS Safari bottom bar, Android chrome bar, etc.) */
      height: 100dvh;
      background: #05050f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
      /* Prevent pull-to-refresh and over-scroll bounce */
      overscroll-behavior: none;
      touch-action: none;
    }

    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Allow the container to be as tall as needed so FIT mode can center */
      width: 100%;
      height: 100%;
    }

    #game-container canvas {
      display: block;
      /* Crisp pixel rendering (for pixelArt: true) */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Prevent the canvas from exceeding the viewport */
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
